[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ducapra"
version = "0.1.0"
description = "Dual-layer cryptographically anchored prompt authentication prototype with triangular liveness attestation."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "cryptography>=41",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
